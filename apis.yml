aid: goodleap
name: GoodLeap
description: >-
  GoodLeap (formerly Loanpal) is a Roseville, California fintech that provides
  point-of-sale financing and a technology platform for sustainable home
  improvement — residential solar, battery storage, HVAC, roofing, smart-home,
  and water-conservation upgrades — delivered through a nationwide network of
  contractors, dealers, and channel partners. For developers, GoodLeap operates
  a Developer API program that lets partners embed a secure credit application
  into a CRM, proposal, or sales tool and integrate modular, RESTful financing
  APIs offering soft credit pulls, real-time loan decisions, loans, leases, and
  PPAs. Integration is available as no-code, low-code, and full-code options,
  with public API resources published on Postman and a partner-gated developer
  portal. This profile was surfaced as a portfolio company of NEA and enriched
  from GoodLeap's public developer and security surface.
